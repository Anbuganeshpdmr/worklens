spring.application.name=worklens
server.port=${WL_SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${WL_DB_HOST:localhost}:${WL_DB_PORT:3306}/${WL_DB_NAME:worklens}?createDatabaseIfNotExist=true
spring.datasource.username=${WL_DB_USERNAME:root}
spring.datasource.password=${WL_DB_PASSWORD:root}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-message=always

#File size configurations
spring.servlet.multipart.max-file-size=${WL_INDV_FILE_SIZE}
spring.servlet.multipart.max-request-size=${WL_MAX_REQ_SIZE}

file.uploadDirectory=${WL_FILE_STORAGE}
file.displayPictureDirectory=${WL_DP_STORAGE}

api.file.path=/api/files/

#Encoded HmacSha256-keys
jwt_key=${WL_JWT_KEY}

jwt_secret=${WL_JWT_SECRET_STRING}

frontend.allowed-origin=${WL_FRONTEND_PORT}